<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #222;
    }
    .container {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .header {
      padding: 18px 20px;
      border-bottom: 1px solid #eee;
      font-size: 20px;
      font-weight: bold;
    }
    .chat-box {
      height: 520px;
      overflow-y: auto;
      padding: 16px;
      background: #fafafa;
    }
    .msg-row {
      display: flex;
      margin-bottom: 14px;
    }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.bot { justify-content: flex-start; }
    .msg {
      max-width: 75%;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      background: #dff1ff;
      border-bottom-right-radius: 6px;
    }
    .msg.bot {
      background: #ececec;
      border-bottom-left-radius: 6px;
    }
    .toolbar {
      padding: 14px 16px;
      border-top: 1px solid #eee;
      background: #fff;
    }
    .file-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .file-name {
      font-size: 13px;
      color: #666;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      min-height: 60px;
      max-height: 160px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #d7dbe3;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      font-size: 15px;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      min-width: 92px;
    }
    button:disabled {
      background: #9bb7f5;
      cursor: not-allowed;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #777;
    }
    .status {
      font-size: 13px;
      color: #666;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">PDF 聊天助手</div>

      <div id="chatBox" class="chat-box">
        <div class="msg-row bot">
          <div class="msg bot">你好，可以直接聊天，也可以上传 PDF 后再提问。</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="file-row">
          <input id="pdfFile" type="file" accept="application/pdf" />
          <span id="fileName" class="file-name">未选择文件</span>
          <span id="status" class="status"></span>
        </div>

        <div class="input-row">
          <textarea id="messageInput" placeholder="输入消息，例如：总结这个 PDF 的内容"></textarea>
          <button id="sendBtn">发送</button>
        </div>

        <div class="hint">
          默认会向 <code>/chat</code> 发送请求。若附带 PDF，则以前端的 multipart/form-data 方式提交：message + file。
        </div>
      </div>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const pdfFile = document.getElementById('pdfFile');
    const fileName = document.getElementById('fileName');
    const statusEl = document.getElementById('status');

    pdfFile.addEventListener('change', () => {
      const file = pdfFile.files[0];
      fileName.textContent = file ? `已选择：${file.name}` : '未选择文件';
    });

    function addMessage(role, text) {
      const row = document.createElement('div');
      row.className = `msg-row ${role}`;

      const bubble = document.createElement('div');
      bubble.className = `msg ${role}`;
      bubble.textContent = text;

      row.appendChild(bubble);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const message = messageInput.value.trim();
      const file = pdfFile.files[0];

      if (!message && !file) {
        alert('请输入消息，或者选择一个 PDF 文件');
        return;
      }

      if (message) addMessage('user', message);
      if (file) addMessage('user', `[上传文件] ${file.name}`);

      messageInput.value = '';
      sendBtn.disabled = true;
      statusEl.textContent = '发送中...';

      try {
        const formData = new FormData();
        formData.append('message', message);
        if (file) formData.append('file', file);

        const response = await fetch('/chat', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const answer = data.answer || data.response || data.output || '后端没有返回 answer 字段';
        addMessage('bot', answer);

        statusEl.textContent = '已完成';
      } catch (err) {
        addMessage('bot', `请求失败：${err.message}`);
        statusEl.textContent = '请求失败';
      } finally {
        sendBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    sendBtn.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
